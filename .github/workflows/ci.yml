# CI — unit tests on Node 20 LTS + 22 current.
# Runtime stays zero npm deps: `node --test tools/*.test.mjs` only. The optional ui/ SPA
# (Vite+React, its own devDependencies) builds to dist/ when present — see "Build UI" step.
name: ci

on:
  push:
    branches: [main, 'auto/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build UI (if present)
        run: |
          if [ -d ui ]; then
            cd ui && npm ci --no-audit --no-fund && npm run build
          fi
      - name: Run unit tests
        run: node --test tools/*.test.mjs
